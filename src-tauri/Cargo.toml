[package]
name = "ironcall-app"
description = "IronCall desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "ironcall_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ironcall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
ironcall-core = { workspace = true, features = ["specta"] }
ironcall-store.workspace = true
ironcall-http.workspace = true
ironcall-secrets.workspace = true
ironcall-import.workspace = true
http.workspace = true
tokio.workspace = true
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
humantime = "2"
ulid.workspace = true
serde_json.workspace = true
indexmap.workspace = true
tauri = { workspace = true, features = [] }
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
axum.workspace = true
tempfile.workspace = true

[lints]
workspace = true
