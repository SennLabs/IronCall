[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
ironcall-core = { path = "crates/ironcall-core" }
ironcall-http = { path = "crates/ironcall-http" }
ironcall-store = { path = "crates/ironcall-store" }
ironcall-secrets = { path = "crates/ironcall-secrets" }
ironcall-import = { path = "crates/ironcall-import" }

# Tauri 2.x and tauri-specta rc pinned (PLAN.md §2, §3.1).
tauri = "2.12"
tauri-build = "2.7"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
indexmap = { version = "2", features = ["serde"] }
ulid = { version = "3", features = ["serde"] }
thiserror = "2"
secrecy = { version = "0.10", features = ["serde"] }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
tokio-util = "0.7"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Test-only
tempfile = "3"
proptest = "1"
axum = "0.8"
rcgen = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
