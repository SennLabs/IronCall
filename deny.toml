# cargo-deny configuration (PLAN.md §9). Run with `just deny`.

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained (not a vulnerability), compile-time only, pulled in by specta. Revisit when specta 2 is stable.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro via specta; no runtime code" },
    # Unmaintained (not a vulnerability), compile-time only, pulled in by Tauri's gtk-rs 0.18 stack on Linux.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained proc-macro via glib/gtk 0.18 (Tauri)" },
    # Unmaintained (not vulnerabilities): the zbus 5 helper crates were folded into zbus 6. They come in
    # through zbus-secret-service-keyring-store (the Linux keychain backend) and tauri-plugin-opener,
    # neither of which has a zbus 6 release yet. Revisit when they do.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: zbus 5 helper crate, merged into zbus 6; waiting on the keyring store and opener plugin" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: zbus 5 helper crate, merged into zbus 6; waiting on the keyring store and opener plugin" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: zbus 5 helper crate, merged into zbus 6; waiting on the keyring store and opener plugin" },
]

[licenses]
# Licence not chosen yet (PLAN.md §1): only allow licences compatible with
# both permissive and proprietary distribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are unpublished and have no licence yet.
ignore = true

[bans]
# Tauri pulls in many duplicate versions we cannot control.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Unmaintained, unsound (RUSTSEC-2025-0068). Use serde-saphyr (PLAN.md §3.3).
    { name = "serde_yml" },
    # Deprecated. Use serde-saphyr.
    { name = "serde_yaml" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
