[package]
name = "ironcall-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
serde_json.workspace = true
tokio-util = { workspace = true, features = ["io"] }
async-compression = { version = "0.4.50", features = ["tokio", "gzip", "zlib", "deflate", "brotli", "zstd"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
url = "2.5.8"
# No public-suffix list: a dev tool talking to known APIs, and it avoids bundling the list.
cookie_store = { version = "0.22.1", default-features = false, features = ["serde_json"] }
cookie = "0.18.1"
x509-parser = "0.18.1"
base64 = "0.22.1"
percent-encoding = "2.3.2"
ring = "0.17.14"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
time = "0.3.55"

[dev-dependencies]
axum = { workspace = true, features = ["multipart"] }
rcgen.workspace = true
hyper-util = { workspace = true, features = ["tokio", "server-auto", "service", "http1", "http2"] }
async-compression = { version = "0.4.50", features = ["tokio", "gzip", "zlib", "deflate", "brotli", "zstd"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
